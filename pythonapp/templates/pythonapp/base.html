<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Service Booking{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #202b46;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 18px;
        }

        nav .brand {
            font-size: 22px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            min-height: 60vh;
        }

        .hero {
            background: white;
            padding: 55px 35px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 18px #0000000d;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            background: #4169e1;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 7px;
            margin: 8px 5px;
        }

        .button:hover {
            background: #2f50b5;
        }

        .messages {
            list-style: none;
            padding: 0;
        }

        .messages li {
            background: #e4f5e9;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>
    <nav>
        <a class="brand" href="{% url 'home' %}">Service Booking</a>

        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'services' %}">Services</a>
            <a href="{% url 'appointments' %}">Appointments</a>
            <a href="{% url 'provider_dashboard' %}">Provider Dashboard</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        </div>
    </nav>

    <main>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {% now "Y" %} Service Booking. All rights reserved.
    </footer>
</body>
</html>
