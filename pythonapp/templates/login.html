{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card panel">
    <h2>Welcome back</h2>
    <p class="text-muted">Log in to see your appointments.</p>
    <form action="/login" method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ old.email }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Log in</button>
    </form>
    <p class="small text-muted mt-4 mb-0">New to Mawid? <a href="/register">Create a client account</a> or <a href="/register/provider">join as a professional</a>.</p>
</div>
{% endblock %}
