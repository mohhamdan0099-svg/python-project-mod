{% extends 'base.html' %}
{% block title %}Register - Appointly{% endblock %}
{% block extra_css %}
<style>
    .auth-wrap { max-width: 560px; margin: 30px auto; }
    .auth-card { padding: 36px 32px; border-top: 5px solid var(--ap-gold); }
    .auth-icon {
        width: 64px; height: 64px; border-radius: 50%; margin: -68px auto 16px;
        display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
        background: var(--ap-gold); color: var(--ap-navy); box-shadow: 0 6px 16px rgba(245,158,11,.4);
    }
    .auth-card .input-group-text { background: #fff; color: var(--ap-indigo); border-radius: 10px 0 0 10px; }
    .auth-card .input-group .form-control { border-radius: 0 10px 10px 0; }
    /* role choice cards */
    .role-card { padding: 14px 8px; text-align: center; line-height: 1.3; }
    .role-card i { font-size: 1.6rem; display: block; margin-bottom: 4px; }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="text-center mb-5 pt-3">
        <h2 class="fw-bold">Welcome to Appointly</h2>
        <p class="text-muted mb-0">Create your account and start booking in minutes</p>
    </div>

    <div class="card auth-card">
        <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
        <h4 class="text-center fw-bold mb-4">Register for Appointly</h4>

        <form action="/register" method="POST">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" name="first_name" placeholder="First name" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" name="last_name" placeholder="Last name" required>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" name="password" placeholder="Min. 8 characters" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" name="confirm_password" placeholder="Repeat password" required>
                    </div>
                </div>
            </div>

            <label class="form-label">User Type</label>
            <div class="row g-2 mb-4">
                <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="role-client" value="client" checked>
                    <label class="btn btn-outline-primary w-100 role-card" for="role-client">
                        <i class="bi bi-person"></i> Client
                    </label>
                </div>
                <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="role-provider" value="provider">
                    <label class="btn btn-outline-primary w-100 role-card" for="role-provider">
                        <i class="bi bi-briefcase"></i> Professional
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">Register</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Do you have an account? <a href="/login" class="fw-semibold text-decoration-none">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
